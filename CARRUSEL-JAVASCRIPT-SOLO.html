     JAVASCRIPT SOLO PARA EL CARRUSEL
     
     INSTRUCCIONES:
     1. Busca en tu HTML el <script> que tiene "cambiarSlide"
     2. Reemplaza TODA la función cambiarSlide() y la función iniciarCarrusel()
     3. O simplemente pega este código ANTES de </body>
     ═══════════════════════════════════════════════════════════════════════ -->

<script>
  // ═══════════════════════════════════════════════════════════════════════
  // CARRUSEL DE TRANSCRIPCIÓN - VERSIÓN DEFINITIVA
  // ═══════════════════════════════════════════════════════════════════════
  
  (function() {
    let slideActual = 1;
    let intervalCarrusel = null;
    const TIEMPO_CAMBIO = 5000; // 5 segundos

    function cambiarSlide() {
      console.log("🎬 Cambiando slide...");
      console.log("   Slide actual:", slideActual);
      
      // Obtener elementos
      const slideActualEl = document.getElementById("slide" + slideActual);
      const siguienteNum = (slideActual % 3) + 1;
      const siguienteEl = document.getElementById("slide" + siguienteNum);
      
      // Verificar que existen
      if (!slideActualEl) {
        console.error("❌ No se encontró slide" + slideActual);
        return;
      }
      if (!siguienteEl) {
        console.error("❌ No se encontró slide" + siguienteNum);
        return;
      }
      
      console.log("   ✅ Transición:", slideActual, "→", siguienteNum);
      
      // Hacer transición
      slideActualEl.classList.remove("active");
      slideActualEl.classList.add("exiting");
      
      setTimeout(function() {
        siguienteEl.classList.add("active");
        
        setTimeout(function() {
          slideActualEl.classList.remove("exiting");
          console.log("   ✅ Slide", siguienteNum, "visible");
        }, 800);
      }, 100);
      
      slideActual = siguienteNum;
    }

    function iniciarCarrusel() {
      console.log("🎬 INICIANDO CARRUSEL FRANCIA");
      
      // Verificar que los slides existen
      const slide1 = document.getElementById("slide1");
      const slide2 = document.getElementById("slide2");
      const slide3 = document.getElementById("slide3");
      
      if (!slide1 || !slide2 || !slide3) {
        console.error("❌ ERROR: No se encontraron los slides");
        console.error("   slide1:", !!slide1);
        console.error("   slide2:", !!slide2);
        console.error("   slide3:", !!slide3);
        return;
      }
      
      console.log("✅ Slides encontrados correctamente");
      
      // Asegurar estado inicial
      slide1.classList.add("active");
      slide2.classList.remove("active", "exiting");
      slide3.classList.remove("active", "exiting");
      
      slideActual = 1;
      console.log("✅ Estado inicial: Slide 1 activo");
      
      // Limpiar intervalo previo si existe
      if (intervalCarrusel) {
        clearInterval(intervalCarrusel);
        console.log("⚠️ Intervalo anterior limpiado");
      }
      
      // Iniciar nuevo intervalo
      intervalCarrusel = setInterval(cambiarSlide, TIEMPO_CAMBIO);
      console.log("✅ Carrusel iniciado - cambia cada", TIEMPO_CAMBIO / 1000, "segundos");
    }

    // Iniciar cuando el DOM esté listo
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function() {
        console.log("📄 DOM cargado - iniciando carrusel...");
        setTimeout(iniciarCarrusel, 1000);
      });
    } else {
      console.log("📄 DOM ya estaba listo - iniciando carrusel...");
      setTimeout(iniciarCarrusel, 1000);
    }
    
    console.log("✅ Script de carrusel cargado");
  })();
</script>
